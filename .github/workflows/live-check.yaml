name: 欣中實際查詢
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scgas-live-check
  cancel-in-progress: false
jobs:
  query:
    if: github.repository == 'yitsewu/shin-chung-gas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$(gh api repos/yitsewu/shin-chung-gas/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Query one bill without publishing private data
        env:
          SCGAS_MONITOR_CUSTOMER_ID: ${{ secrets.SCGAS_MONITOR_CUSTOMER_ID }}
          SCGAS_MONITOR_CUSTOMER_NAME: ${{ secrets.SCGAS_MONITOR_CUSTOMER_NAME }}
          SCGAS_RELEASE: ${{ steps.release.outputs.tag }}
          SCGAS_RELEASE_ROOT: ${{ github.workspace }}/release
        run: python scripts/live_check.py
