name: 驗證欣中天然氣整合
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest tzdata ruff
      - run: ruff check custom_components tests scripts
      - run: pytest tests --ignore=tests/ha -q
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: scgas
          path: dist/scgas.zip
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ha.txt
      - run: pip install -r .github/requirements-ha.txt
      - run: pytest tests/ha -v --timeout=60
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
